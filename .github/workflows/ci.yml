name: VisionGuard CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linting
        run: |
          ruff check backend/app backend/tests

      - name: Generate Test Video Fixture
        run: |
          python -m app.db.generate_sample_video
          python -m app.db.generate_eval_fixture
        working-directory: backend

      - name: Run Pytest Suite
        run: |
          pytest -v
        working-directory: backend

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript Strict Typecheck
        run: npm run lint
        working-directory: frontend

      - name: Build Production Bundle
        run: npm run build
        working-directory: frontend


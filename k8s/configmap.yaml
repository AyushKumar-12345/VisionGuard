apiVersion: v1
kind: ConfigMap
metadata:
  name: visionguard-config
  namespace: visionguard
  labels:
    app.kubernetes.io/name: visionguard
    app.kubernetes.io/component: configuration
data:
  PROJECT_NAME: "VisionGuard"
  PROJECT_VERSION: "1.0.0"
  API_V1_PREFIX: "/api/v1"
  DEBUG: "false"
  DATA_DIR: "/app/data"
  CPU_INFERENCE_THREADS: "4"
  MAX_CONCURRENT_JOBS: "2"
  DEVICE: "cpu"
  POSTGRES_HOST: "visionguard-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "visionguard"


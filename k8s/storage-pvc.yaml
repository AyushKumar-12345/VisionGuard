apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: visionguard-postgres-pvc
  namespace: visionguard
  labels:
    app.kubernetes.io/name: visionguard
    app.kubernetes.io/component: database-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: visionguard-data-pvc
  namespace: visionguard
  labels:
    app.kubernetes.io/name: visionguard
    app.kubernetes.io/component: media-storage
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi


apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: visionguard-ingress
  namespace: visionguard
  labels:
    app.kubernetes.io/name: visionguard
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "250m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  rules:
    - http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: visionguard-backend
                port:
                  number: 8000
          - path: /media/
            pathType: Prefix
            backend:
              service:
                name: visionguard-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: visionguard-frontend
                port:
                  number: 80


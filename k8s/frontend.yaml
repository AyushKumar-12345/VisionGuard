apiVersion: apps/v1
kind: Deployment
metadata:
  name: visionguard-frontend
  namespace: visionguard
  labels:
    app.kubernetes.io/name: visionguard
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visionguard-frontend
  template:
    metadata:
      labels:
        app: visionguard-frontend
    spec:
      containers:
        - name: frontend
          image: visionguard-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: visionguard-frontend
  namespace: visionguard
  labels:
    app.kubernetes.io/name: visionguard
    app.kubernetes.io/component: frontend-service
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: visionguard-frontend


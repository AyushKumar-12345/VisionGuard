apiVersion: apps/v1
kind: Deployment
metadata:
  name: visionguard-backend
  namespace: visionguard
  labels:
    app.kubernetes.io/name: visionguard
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visionguard-backend
  template:
    metadata:
      labels:
        app: visionguard-backend
    spec:
      containers:
        - name: backend
          image: visionguard-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: visionguard-config
            - secretRef:
                name: visionguard-secret
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: media-storage
              mountPath: /app/data
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: visionguard-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: visionguard-backend
  namespace: visionguard
  labels:
    app.kubernetes.io/name: visionguard
    app.kubernetes.io/component: backend-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: visionguard-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: visionguard-backend-hpa
  namespace: visionguard
  labels:
    app.kubernetes.io/name: visionguard
    app.kubernetes.io/component: backend-autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: visionguard-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80


services:
  # VisionGuard FastAPI Computer Vision Backend
  - type: web
    name: visionguard-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: DEBUG
        value: "False"
      - key: DEVICE
        value: "cpu"
      - key: CPU_INFERENCE_THREADS
        value: "4"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./visionguard.db

  # VisionGuard React Frontend
  - type: web
    name: visionguard-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

